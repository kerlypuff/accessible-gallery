<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Accessible Photo Gallery</h1>

    <!-- Big preview area -->
    <div id="image">Hover over or tab to an image below to display here.</div>

    <!-- 6 thumbnails wrapped in figures -->
    <div class="gallery">
        <figure>
            <img class="preview" src="images/rarity.jpg" alt="Rarity: Purple hair">
            <figcaption>Rarity</figcaption>
        </figure>
        <figure>
            <img class="preview" src="images/applejack.jpg" alt="Applejack: Blonde hair">
            <figcaption>Applejack</figcaption>
        </figure>
        <figure>
            <img class="preview" src="images/rainbowdash.jpg" alt="Rainbow Dash: Rainbow hair">
            <figcaption>Rainbow Dash</figcaption>
        </figure>
        <figure>
            <img class="preview" src="images/twilightsparkle.jpg" alt="Twilight Sparkle: Pink and Dark blue hair">
            <figcaption>Twilight Sparkle</figcaption>
        </figure>
    </div>

    <script src="script.js"></script>
</body>
</html>
